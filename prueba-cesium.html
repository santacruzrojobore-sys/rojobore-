  function obtenerImagenLugar(nombre) {
    const baseUrl = 'https://raw.githubusercontent.com/santacruzrojobore-sys/santarojobore/main/imagenes/';
    const ruta = mapaImagenes[nombre] || 'lugarturistico/balneariomunicipal.jpeg';
    if (ruta.startsWith('http')) return ruta;
    return baseUrl + ruta;
  }

  let viewer;

  async function iniciarVisor() {
    const token = document.getElementById('tokenInput').value.trim();
    if (!token) {
      alert('Por favor pega tu token de Cesium ion primero.');
      return;
    }

    Cesium.Ion.defaultAccessToken = token;

    viewer = new Cesium.Viewer('cesiumContainer', {
      terrain: Cesium.Terrain.fromWorldTerrain(),
      timeline: false,
      animation: false,
      baseLayerPicker: false,
      geocoder: false,
      homeButton: false,
      sceneModePicker: false,
      navigationHelpButton: false,
      infoBox: false,
      selectionIndicator: false,
    });

    try {
      const bingLayer = await Cesium.IonImageryProvider.fromAssetId(2);
      viewer.imageryLayers.addImageryProvider(bingLayer);
    } catch (e) {
      console.warn('No se pudo cargar Bing Aerial.', e);
    }

    // Función auxiliar para añadir puntos al mapa
    function agregarPunto(lugar, color, prefijo) {
      const imagenUrl = obtenerImagenLugar(lugar.nombre);
      viewer.entities.add({
        name: prefijo + lugar.nombre,
        position: Cesium.Cartesian3.fromDegrees(lugar.lon, lugar.lat, 100),
        point: {
          pixelSize: 12,
          color: Cesium.Color.fromCssColorString(color),
          outlineColor: Cesium.Color.WHITE,
          outlineWidth: 2,
          heightReference: Cesium.HeightReference.CLAMP_TO_GROUND
        },
        billboard: {
          image: imagenUrl,
          width: 70,
          height: 50,
          verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
          pixelOffset: new Cesium.Cartesian2(0, -10),
          heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
          distanceDisplayCondition: new Cesium.DistanceDisplayCondition(0, 25000),
          disableDepthTestDistance: Number.POSITIVE_INFINITY
        },
        label: {
          text: lugar.nombre,
          font: '11px DM Sans, sans-serif',
          fillColor: Cesium.Color.WHITE,
          outlineColor: Cesium.Color.BLACK,
          outlineWidth: 2,
          style: Cesium.LabelStyle.FILL_AND_OUTLINE,
          pixelOffset: new Cesium.Cartesian2(0, -75),
          heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
          distanceDisplayCondition: new Cesium.DistanceDisplayCondition(0, 25000)
        }
      });
    }

    // Añadir las 3 categorías
    atractivos.forEach(l => agregarPunto(l, colores[l.tipo] || colores.turismo, '📍 '));
    hoteles.forEach(l => agregarPunto(l, colores.hotel, '🏨 '));
    restaurantes.forEach(l => agregarPunto(l, colores.restaurante, '🍽️ '));

    // Detectar clic
    viewer.screenSpaceEventHandler.setInputAction(function (movement) {
      const picked = viewer.scene.pick(movement.position);
      if (Cesium.defined(picked) && picked.id && picked.id.name) {
        const nombreConPrefijo = picked.id.name;
        const nombre = nombreConPrefijo.replace('📍 ', '').replace('🏨 ', '').replace('🍽️ ', '');
        
        let lugarData = atractivos.find(a => a.nombre === nombre);
        let categoria = 'turismo';
        if (!lugarData) { lugarData = hoteles.find(h => h.nombre === nombre); categoria = 'hotel'; }
        if (!lugarData) { lugarData = restaurantes.find(r => r.nombre === nombre); categoria = 'restaurante'; }
        
        if (lugarData) mostrarDetalle(lugarData, categoria);
      }
    }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

    volverARobore();
    document.getElementById('tokenPanel').style.display = 'none';
    document.getElementById('infoPanel').style.display = 'block';
  }

  function mostrarDetalle(lugar, categoria) {
    const panel = document.getElementById('detallePanel');
    document.getElementById('detalleImg').src = obtenerImagenLugar(lugar.nombre);
    document.getElementById('detalleNombre').textContent = lugar.nombre;
    
    let descripcion = '';
    
    if (categoria === 'hotel') {
      descripcion = '🏨 Hotel · Bs ' + lugar.precio + '/noche · ★ ' + lugar.rating + '\n\n' +
                    '🛎️ Servicios: ' + lugar.servicios;
    } else if (categoria === 'restaurante') {
      descripcion = '🍽️ Restaurante · ★ ' + lugar.rating + '\n\n' +
                    '🍴 Especialidad: ' + lugar.especialidad + '\n' +
                    '🕐 Horario: ' + lugar.horario + '\n' +
                    '💰 Almuerzo desde: Bs ' + lugar.precio;
    } else {
      descripcion = '📍 ' + lugar.descripcion + '\n\n' +
                    '💰 Precio: Bs ' + lugar.precioLocal + ' (local) / Bs ' + lugar.precioExtranjero + ' (extranjero)\n' +
                    '🕐 Horario: ' + lugar.horario + ' · ★ ' + lugar.rating + '\n' +
                    '🚶 Dificultad: ' + lugar.dificultad + '\n' +
                    '📏 Distancia: ' + lugar.distancia + '\n' +
                    '🚗 Cómo llegar: ' + lugar.transporte + '\n' +
                    '🛎️ Servicios: ' + lugar.servicios + '\n' +
                    '💡 Recomendación: ' + lugar.recomendacion;
    }
    
    document.getElementById('detalleDesc').textContent = descripcion;
    panel.style.display = 'block';
  }

  function cerrarDetalle() {
    document.getElementById('detallePanel').style.display = 'none';
  }

  window.volverARobore = function () {
    if (!viewer) return;
    viewer.camera.flyTo({
      destination: Cesium.Cartesian3.fromDegrees(ROBORE.lon, ROBORE.lat, 8000),
      orientation: {
        heading: Cesium.Math.toRadians(0),
        pitch: Cesium.Math.toRadians(-45),
        roll: 0
      },
      duration: 2
    });
  };
</script>
