<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Roboré 3D — Mapa de la Chiquitanía</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- CesiumJS vía CDN (jsDelivr, sin necesidad de key propia) -->
  <script src="https://cdn.jsdelivr.net/npm/cesium@1.118.0/Build/Cesium/Cesium.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/cesium@1.118.0/Build/Cesium/Widgets/widgets.css" rel="stylesheet">

  <style>
    html, body, #cesiumContainer {
      width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
      font-family: 'DM Sans', sans-serif;
    }

    #tokenPanel {
      position: absolute; top: 20px; left: 20px; z-index: 1001;
      background: rgba(13, 17, 23, 0.95);
      border: 1px solid rgba(57, 255, 20, 0.3);
      border-radius: 12px; padding: 1rem;
      color: #E6EDF3; max-width: 300px; font-size: 13px;
    }
    #tokenPanel h3 { color: #39FF14; margin: 0 0 0.5rem 0; font-size: 1rem; }
    #tokenPanel input {
      width: 100%; box-sizing: border-box; padding: 8px; margin-top: 6px;
      border-radius: 6px; border: 1px solid #333; background: #0D1117; color: #E6EDF3;
    }
    #tokenPanel small { color: rgba(255,255,255,0.5); display: block; margin-top: 6px; }

    #infoPanel {
      position: absolute; top: 20px; right: 20px;
      background: rgba(13, 17, 23, 0.95);
      border: 1px solid rgba(57, 255, 20, 0.3);
      border-radius: 12px; padding: 1rem;
      color: #E6EDF3; max-width: 280px;
      font-size: 13px; z-index: 1000;
      display: none;
    }
    #infoPanel h3 {
      color: #39FF14; margin: 0 0 0.5rem 0;
      font-size: 1rem; font-family: 'Playfair Display', serif;
    }
    button {
      background: #39FF14; color: #0D1117; border: none;
      padding: 0.5rem 1rem; border-radius: 8px;
      font-weight: 700; cursor: pointer; width: 100%;
      margin-top: 0.5rem; font-size: 12px;
    }
    button:hover { filter: brightness(1.1); }

    /* Panel de detalle al hacer clic en un atractivo */
    #detallePanel {
      position: absolute; bottom: 20px; left: 50%;
      transform: translateX(-50%);
      background: rgba(13, 17, 23, 0.97);
      border: 2px solid rgba(57, 255, 20, 0.5);
      border-radius: 14px; padding: 1rem;
      color: #E6EDF3; max-width: 420px; width: 90%;
      font-size: 13px; z-index: 1002;
      display: none; box-shadow: 0 10px 40px rgba(0,0,0,0.7);
    }
    #detallePanel img {
      width: 100%; max-height: 220px; object-fit: cover;
      border-radius: 8px; margin-bottom: 0.6rem;
    }
    #detallePanel h3 {
      color: #39FF14; margin: 0 0 0.4rem 0;
      font-size: 1.1rem; font-family: 'Playfair Display', serif;
    }
    #detallePanel .cerrar {
      position: absolute; top: 8px; right: 8px;
      background: rgba(255,255,255,0.1); color: #fff;
      border: none; width: 30px; height: 30px;
      border-radius: 8px; cursor: pointer; font-size: 14px;
      width: auto; padding: 0 8px; margin: 0;
    }
  </style>
</head>
<body>

<div id="cesiumContainer"></div>

<!-- Panel para pegar el token (nunca hardcodeado en el archivo) -->
<div id="tokenPanel">
  <h3>🔑 Cesium ion Token</h3>
  <label for="tokenInput">Pega tu access token:</label>
  <input id="tokenInput" type="text" placeholder="eyJhbGci...">
  <button onclick="iniciarVisor()">Cargar mapa de Roboré</button>
  <small>Consíguelo gratis en ion.cesium.com/tokens — nunca lo compartas ni lo subas a un repo público.</small>
</div>

<div id="infoPanel">
  <h3>🗺 Roboré 3D</h3>
  <p style="margin: 0 0 0.5rem 0; color: rgba(255,255,255,0.7); font-size: 12px;">
    Haz clic en las imágenes flotantes para ver el detalle
  </p>
  <button onclick="volverARobore()">📍 Centrar en Roboré</button>
</div>

<!-- Panel de detalle del atractivo -->
<div id="detallePanel">
  <button class="cerrar" onclick="cerrarDetalle()">✕</button>
  <img id="detalleImg" src="" alt="">
  <h3 id="detalleNombre"></h3>
  <p id="detalleDesc" style="color: rgba(255,255,255,0.7); margin: 0; font-size: 12px;"></p>
</div>

<script>
  // Coordenadas de Roboré
  const ROBORE = { lon: -59.7583, lat: -18.3328 };

  // Lista de atractivos turísticos (coordenadas aproximadas)
  const atractivos = [
    { nombre: 'Balneario Municipal El Chorro', lon: -59.7583, lat: -18.3328, tipo: 'turismo' },
    { nombre: 'Las Pampas', lon: -59.7700, lat: -18.3450, tipo: 'turismo' },
    { nombre: 'Las Pozas', lon: -59.7200, lat: -18.3100, tipo: 'turismo' },
    { nombre: 'Cuevas de Miserendino', lon: -59.7800, lat: -18.3500, tipo: 'turismo' },
    { nombre: 'El Chorro de San Luis', lon: -59.7900, lat: -18.3600, tipo: 'turismo' },
    { nombre: 'Los Totaizales', lon: -59.8100, lat: -18.3700, tipo: 'turismo' },
    { nombre: 'Santuario Mariano de la Torre', lon: -60.0300, lat: -18.1500, tipo: 'chochis' },
    { nombre: 'Cascada de los Helechos', lon: -60.0400, lat: -18.1600, tipo: 'chochis' },
    { nombre: 'Cascada Velo de Novia', lon: -60.0400, lat: -18.1600, tipo: 'chochis' },
    { nombre: 'Cascada de Yororoba', lon: -59.8100, lat: -18.3700, tipo: 'aguas' },
    { nombre: 'Centro Turístico Los Hervores', lon: -59.7600, lat: -18.3300, tipo: 'turismo' }
  ];

  const colores = {
    turismo: '#39FF14',
    chochis: '#FFD700',
    aguas: '#38BDF8'
  };

  // Mapeo de nombre → archivo de imagen en tu repositorio
  const mapaImagenes = {
    'Balneario Municipal El Chorro': 'balneariomunicipal.jpeg',
    'Las Pampas': 'laspampas.jpg',
    'Las Pozas': 'laspozas.jpeg',
    'Cuevas de Miserendino': 'cuevasdemiserendino.jpeg',
    'El Chorro de San Luis': 'chorrosanluis.png',
    'Los Totaizales': 'totaizales.jpg',
    'Santuario Mariano de la Torre': 'santuariomariano.jpeg',
    'Cascada de los Helechos': 'cascadahelechos.jpg',
    'Cascada Velo de Novia': 'cascadavelodenovia.jpeg',
    'Cascada de Yororoba': 'cascadadeyororoba.jpeg',
    'Centro Turístico Los Hervores': 'loshervores.jpg'
  };

  // Función que devuelve la URL completa de la imagen
  function obtenerImagenLugar(nombre) {
    const baseUrl = 'https://raw.githubusercontent.com/santacruzrojobore-sys/santarojobore/main/imagenes/lugarturistico/';
    return baseUrl + (mapaImagenes[nombre] || 'balneariomunicipal.jpeg');
  }

  let viewer;

  async function iniciarVisor() {
    const token = document.getElementById('tokenInput').value.trim();
    if (!token) {
      alert('Por favor pega tu token de Cesium ion primero.');
      return;
    }

    Cesium.Ion.defaultAccessToken = token;

    viewer = new Cesium.Viewer('cesiumContainer', {
      terrain: Cesium.Terrain.fromWorldTerrain(),
      timeline: false,
      animation: false,
      baseLayerPicker: false,
      geocoder: false,
      homeButton: false,
      sceneModePicker: false,
      navigationHelpButton: false,
      infoBox: false,
      selectionIndicator: false,
    });

    // Imagen satelital real vía Cesium ion (asset 2 = Bing Aerial)
    try {
      const bingLayer = await Cesium.IonImageryProvider.fromAssetId(2);
      viewer.imageryLayers.addImageryProvider(bingLayer);
    } catch (e) {
      console.warn('No se pudo cargar Bing Aerial, se usa capa base por defecto.', e);
    }

    // Añadir puntos de atractivos con imágenes flotantes
    atractivos.forEach(function (lugar) {
      const imagenUrl = obtenerImagenLugar(lugar.nombre);

      viewer.entities.add({
        name: lugar.nombre,
        position: Cesium.Cartesian3.fromDegrees(lugar.lon, lugar.lat, 100),

        // Punto de color
        point: {
          pixelSize: 12,
          color: Cesium.Color.fromCssColorString(colores[lugar.tipo] || colores.turismo),
          outlineColor: Cesium.Color.WHITE,
          outlineWidth: 2,
          heightReference: Cesium.HeightReference.CLAMP_TO_GROUND
        },

        // Imagen flotante (billboard)
        billboard: {
          image: imagenUrl,
          width: 100,
          height: 70,
          verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
          pixelOffset: new Cesium.Cartesian2(0, -10),
          heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
          distanceDisplayCondition: new Cesium.DistanceDisplayCondition(0, 50000),
          disableDepthTestDistance: Number.POSITIVE_INFINITY
        },

        // Etiqueta con el nombre (oculta si hay billboard, se muestra al hacer zoom)
        label: {
          text: lugar.nombre,
          font: '11px DM Sans, sans-serif',
          fillColor: Cesium.Color.WHITE,
          outlineColor: Cesium.Color.BLACK,
          outlineWidth: 2,
          style: Cesium.LabelStyle.FILL_AND_OUTLINE,
          pixelOffset: new Cesium.Cartesian2(0, -90),
          heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
          distanceDisplayCondition: new Cesium.DistanceDisplayCondition(0, 30000)
        }
      });

      // Detectar clic en la imagen/punto para mostrar el panel de detalle
      viewer.screenSpaceEventHandler.setInputAction(function (movement) {
        const picked = viewer.scene.pick(movement.position);
        if (Cesium.defined(picked) && picked.id && picked.id.name) {
          const nombre = picked.id.name;
          const lugarData = atractivos.find(a => a.nombre === nombre);
          if (lugarData) {
            mostrarDetalle(lugarData);
          }
        }
      }, Cesium.ScreenSpaceEventType.LEFT_CLICK);
    });

    volverARobore();

    document.getElementById('tokenPanel').style.display = 'none';
    document.getElementById('infoPanel').style.display = 'block';
  }

  // Mostrar panel de detalle
  function mostrarDetalle(lugar) {
    const panel = document.getElementById('detallePanel');
    document.getElementById('detalleImg').src = obtenerImagenLugar(lugar.nombre);
    document.getElementById('detalleNombre').textContent = lugar.nombre;
    document.getElementById('detalleDesc').textContent = 'Lat: ' + lugar.lat.toFixed(4) + ' · Lon: ' + lugar.lon.toFixed(4);
    panel.style.display = 'block';
  }

  function cerrarDetalle() {
    document.getElementById('detallePanel').style.display = 'none';
  }

  window.volverARobore = function () {
    if (!viewer) return;
    viewer.camera.flyTo({
      destination: Cesium.Cartesian3.fromDegrees(ROBORE.lon, ROBORE.lat, 8000),
      orientation: {
        heading: Cesium.Math.toRadians(0),
        pitch: Cesium.Math.toRadians(-45),
        roll: 0
      },
      duration: 2
    });
  };
</script>

</body>
</html>
