<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Roboré 3D — Mapa de la Chiquitanía</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script src="https://cdn.jsdelivr.net/npm/cesium@1.118.0/Build/Cesium/Cesium.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/cesium@1.118.0/Build/Cesium/Widgets/widgets.css" rel="stylesheet">

  <style>
    html, body, #cesiumContainer {
      width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
      font-family: 'DM Sans', system-ui, sans-serif;
    }

    #tokenPanel {
      position: absolute; top: 20px; left: 20px; z-index: 1001;
      background: rgba(13, 17, 23, 0.95);
      border: 1px solid rgba(57, 255, 20, 0.3);
      border-radius: 12px; padding: 1rem;
      color: #E6EDF3; max-width: 300px; font-size: 13px;
    }
    #tokenPanel h3 { color: #39FF14; margin: 0 0 0.5rem 0; font-size: 1rem; }
    #tokenPanel input {
      width: 100%; box-sizing: border-box; padding: 8px; margin-top: 6px;
      border-radius: 6px; border: 1px solid #333; background: #0D1117; color: #E6EDF3;
    }
    #tokenPanel small { color: rgba(255,255,255,0.5); display: block; margin-top: 6px; }

    #infoPanel {
      position: absolute; top: 20px; right: 20px;
      background: rgba(13, 17, 23, 0.95);
      border: 1px solid rgba(57, 255, 20, 0.3);
      border-radius: 12px; padding: 1rem;
      color: #E6EDF3; max-width: 260px;
      font-size: 13px; z-index: 1000;
      display: none;
    }
    #infoPanel h3 { color: #39FF14; margin: 0 0 0.5rem 0; font-size: 1rem; }
    button.btnGreen {
      background: #39FF14; color: #0D1117; border: none;
      padding: 0.5rem 1rem; border-radius: 8px;
      font-weight: 700; cursor: pointer; width: 100%;
      margin-top: 0.5rem; font-size: 12px;
    }
    button.btnGreen:hover { filter: brightness(1.1); }

    /* ===== FICHA COMPLETA DEL LUGAR ===== */
    #detailPanel {
      position: absolute; bottom: 0; left: 50%;
      transform: translateX(-50%) translateY(100%);
      transition: transform 0.3s ease;
      background: rgba(13, 17, 23, 0.98);
      border: 1px solid rgba(57, 255, 20, 0.35);
      border-radius: 18px 18px 0 0;
      color: #E6EDF3; width: min(480px, 94vw);
      max-height: 78vh; overflow-y: auto;
      z-index: 1002; box-shadow: 0 -10px 50px rgba(0,0,0,0.7);
    }
    #detailPanel.open { transform: translateX(-50%) translateY(0); }
    #detailPanel img#detailImg {
      width: 100%; height: 220px; object-fit: cover; display: block;
    }
    #detailPanel .body { padding: 1.1rem 1.3rem 1.4rem; }
    #detailPanel h2 {
      font-family: 'Playfair Display', Georgia, serif;
      color: #39FF14; margin: 0 0 0.3rem 0; font-size: 1.3rem;
    }
    .tagRow { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 0.7rem; }
    .tag {
      background: rgba(57,255,20,0.12); color: #39FF14;
      border: 1px solid rgba(57,255,20,0.3);
      font-size: 0.7rem; font-weight: 700;
      padding: 0.2rem 0.6rem; border-radius: 20px;
    }
    .descText { font-size: 0.88rem; line-height: 1.6; color: #E6EDF3; margin-bottom: 0.8rem; }
    .infoGrid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem;
      background: #161B22; border: 1px solid #30363D; border-radius: 12px;
      padding: 0.8rem; margin-bottom: 0.8rem;
    }
    .infoGrid .item { font-size: 0.78rem; }
    .infoGrid .item .lbl { color: #8B949E; display: block; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 2px; }
    .tipBox {
      border-left: 3px solid #FFD700; background: rgba(255,215,0,0.06);
      padding: 0.7rem 0.9rem; border-radius: 8px; margin-bottom: 0.8rem;
    }
    .tipBox .tlbl { font-size: 0.72rem; font-weight: 700; color: #FFD700; margin-bottom: 3px; }
    .tipBox .ttxt { font-size: 0.8rem; color: #cfd6de; }
    .priceBox {
      background: #161B22; border: 1px solid #30363D; border-radius: 12px;
      padding: 0.8rem 0.9rem; margin-bottom: 0.9rem;
    }
    .priceRow { display: flex; justify-content: space-between; font-size: 0.85rem; padding: 0.15rem 0; }
    .priceRow .big { font-size: 1.3rem; font-weight: 900; color: #39FF14; }
    .btnRow { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .btnRow a, .btnRow button {
      flex: 1; min-width: 120px; text-align: center; text-decoration: none;
      padding: 0.7rem; border-radius: 10px; font-weight: 700; font-size: 0.78rem;
      border: none; cursor: pointer; font-family: inherit;
    }
    .btnMaps { background: rgba(66,133,244,0.18); color: #4285F4; border: 1px solid rgba(66,133,244,0.35) !important; }
    .btnClose {
      position: sticky; top: 10px; float: right; margin-right: 10px;
      background: rgba(255,255,255,0.12); color: #fff; border: none;
      width: 34px; height: 34px; border-radius: 8px; cursor: pointer; font-size: 1rem;
      z-index: 5;
    }
  </style>
</head>
<body>

<div id="cesiumContainer"></div>

<div id="tokenPanel">
  <h3>🔑 Cesium ion Token</h3>
  <label for="tokenInput">Pega tu access token:</label>
  <input id="tokenInput" type="text" placeholder="eyJhbGci...">
  <button class="btnGreen" onclick="iniciarVisor()">Cargar mapa de Roboré</button>
  <small>Consíguelo gratis en ion.cesium.com/tokens — nunca lo compartas ni lo subas a un repo público.</small>
</div>

<div id="infoPanel">
  <h3>🗺 Roboré 3D</h3>
  <p style="margin:0 0 0.5rem 0;color:rgba(255,255,255,0.7);font-size:12px;">Toca un punto para ver la ficha completa</p>
  <button class="btnGreen" onclick="volverARobore()">📍 Centrar en Roboré</button>
</div>

<div id="detailPanel">
  <button class="btnClose" onclick="cerrarDetalle()">✕</button>
  <img id="detailImg" src="" alt="">
  <div class="body" id="detailBody"></div>
</div>

<script>
  const ROBORE = { lon: -59.7583, lat: -18.3328 };

  // Dataset completo (mismos datos que la guía Rojobore, solo lugares turísticos)
  const atractivos = [
    { id:1, nombre:'Balneario Municipal El Chorro', municipio:'Roboré', lon:-59.7583, lat:-18.3328, rating:4.5, horario:'08:00-18:00', dificultad:'Fácil', descripcion:'Balneario municipal con piscinas naturales de agua cristalina.', distancia:'Centro de Roboré', transporte:'Caminando 5 min', experiencia:'Relax, familiar', servicios:'Vestidores, baños, quioscos', recomendacion:'Llevar traje de baño y protector solar', precioLocal:10, precioExtranjero:20, imagen:'https://raw.githubusercontent.com/santacruzrojobore-sys/santarojobore/main/imagenes/lugarturistico/balneariomunicipal.jpeg', googleMaps:'https://maps.app.goo.gl/eeZzYqQRrB1Qtw4n8' },
    { id:2, nombre:'Las Pampas', municipio:'Roboré', lon:-59.77, lat:-18.345, rating:4.3, horario:'06:00-17:00', dificultad:'Moderada', descripcion:'Sabana chiquitana con avistamiento de aves.', distancia:'12 km al norte', transporte:'Taxi o bicicleta', experiencia:'Naturaleza, aventura', servicios:'Guías locales', recomendacion:'Calzado cómodo, agua, binoculares', precioLocal:15, precioExtranjero:30, imagen:'https://raw.githubusercontent.com/santacruzrojobore-sys/santarojobore/main/imagenes/lugarturistico/laspampas.jpg', googleMaps:'https://maps.app.goo.gl/bCKPCNzh1Vxf9Upt9' },
    { id:3, nombre:'Las Pozas', municipio:'Roboré', lon:-59.72, lat:-18.31, rating:4.4, horario:'08:00-17:00', dificultad:'Fácil', descripcion:'Piscinas naturales entre rocas.', distancia:'15 km de Roboré', transporte:'Vehículo o moto', experiencia:'Naturaleza, relax', servicios:'Sin infraestructura', recomendacion:'Llevar agua y protector solar', precioLocal:15, precioExtranjero:25, imagen:'https://raw.githubusercontent.com/santacruzrojobore-sys/santarojobore/main/imagenes/lugarturistico/laspozas.jpeg', googleMaps:'https://maps.app.goo.gl/GkrpywT8gemHU9zW9' },
    { id:4, nombre:'Cuevas de Miserendino', municipio:'Roboré', lon:-59.78, lat:-18.35, rating:4.5, horario:'08:00-16:00', dificultad:'Moderada', descripcion:'Cuevas con estalactitas.', distancia:'25 km de Roboré', transporte:'4x4, caminata 1 km', experiencia:'Aventura, exploración', servicios:'Sin servicios', recomendacion:'Linterna, calzado cerrado', precioLocal:20, precioExtranjero:35, imagen:'https://raw.githubusercontent.com/santacruzrojobore-sys/santarojobore/main/imagenes/lugarturistico/cuevasdemiserendino.jpeg', googleMaps:'https://maps.app.goo.gl/wjC6vqGf1DF4ozdk8' },
    { id:5, nombre:'El Chorro de San Luis', municipio:'Roboré', lon:-59.79, lat:-18.36, rating:4.8, horario:'07:00-17:00', dificultad:'Moderada', descripcion:'Cascada de 30 m en cañadón rocoso.', distancia:'22 km al sur', transporte:'4x4, últimos 3 km a pie', experiencia:'Aventura, naturaleza', servicios:'Sin servicios', recomendacion:'Calzado antideslizante', precioLocal:20, precioExtranjero:40, imagen:'https://raw.githubusercontent.com/santacruzrojobore-sys/santarojobore/main/imagenes/lugarturistico/chorrosanluis.png', googleMaps:'https://maps.app.goo.gl/b8bAEAvv1Get6S136' },
    { id:6, nombre:'Los Totaizales', municipio:'Roboré', lon:-59.81, lat:-18.37, rating:4.6, horario:'08:00-16:00', dificultad:'Moderada', descripcion:'Pozas naturales entre rocas milenarias.', distancia:'18 km al oeste', transporte:'Vehículo 4x4', experiencia:'Aventura, naturaleza', servicios:'Sin infraestructura', recomendacion:'Calzado para agua', precioLocal:25, precioExtranjero:45, imagen:'https://raw.githubusercontent.com/santacruzrojobore-sys/santarojobore/main/imagenes/lugarturistico/totaizales.jpg', googleMaps:'https://maps.app.goo.gl/C1EZQikEALSQmiCx5' },
    { id:7, nombre:'Santuario Mariano de la Torre', municipio:'Chochís', lon:-60.03, lat:-18.15, rating:4.4, horario:'09:00-17:00', dificultad:'Fácil', descripcion:'Complejo histórico y religioso en rocas.', distancia:'30 km de Roboré', transporte:'Bus o taxi', experiencia:'Cultural, religioso', servicios:'Baños, estacionamiento', recomendacion:'Ropa adecuada', precioLocal:20, precioExtranjero:50, imagen:'https://raw.githubusercontent.com/santacruzrojobore-sys/santarojobore/main/imagenes/lugarturistico/santuariomariano.jpeg', googleMaps:'https://maps.app.goo.gl/dYkvkNKyMkcYGGJQ7' },
    { id:8, nombre:'Cascada de los Helechos', municipio:'Chochís', lon:-60.04, lat:-18.16, rating:4.3, horario:'07:00-17:00', dificultad:'Moderada', descripcion:'Cascada rodeada de helechos gigantes.', distancia:'8 km de Chochís', transporte:'Caminata 30 min', experiencia:'Naturaleza, aventura', servicios:'Sin servicios', recomendacion:'Calzado antideslizante', precioLocal:15, precioExtranjero:30, imagen:'https://raw.githubusercontent.com/santacruzrojobore-sys/santarojobore/main/imagenes/lugarturistico/cascadahelechos.jpg', googleMaps:'https://maps.app.goo.gl/RwPbSHwzPqWC8xLy9' },
    { id:9, nombre:'Cascada de Yororoba', municipio:'Aguas Calientes', lon:-59.81, lat:-18.37, rating:4.2, horario:'07:00-17:00', dificultad:'Moderada', descripcion:'Caída de agua con piscinas naturales.', distancia:'40 km de Roboré', transporte:'Vehículo 4x4', experiencia:'Aventura, naturaleza', servicios:'Ninguno', recomendacion:'Agua, protector solar', precioLocal:15, precioExtranjero:30, imagen:'https://raw.githubusercontent.com/santacruzrojobore-sys/santarojobore/main/imagenes/lugarturistico/cascadadeyororoba.jpeg', googleMaps:'https://maps.app.goo.gl/SBSekZhz5LY1iroV7' },
    { id:10, nombre:'Centro Turístico Los Hervores', municipio:'Roboré', lon:-59.76, lat:-18.33, rating:4.0, horario:'08:00-18:00', dificultad:'Fácil', descripcion:'Aguas termales con pozas relajantes.', distancia:'10 km de Roboré', transporte:'Taxi o vehículo particular', experiencia:'Relax, salud', servicios:'Baños, vestidores, piscinas', recomendacion:'Llevar traje de baño y toalla', precioLocal:30, precioExtranjero:50, imagen:'https://raw.githubusercontent.com/santacruzrojobore-sys/santarojobore/main/imagenes/lugarturistico/loshervores.jpg', googleMaps:'https://maps.app.goo.gl/u93mMAXRXRNiLjgDA' },
    { id:11, nombre:'Cascada Velo de Novia', municipio:'Chochís', lon:-60.04, lat:-18.16, rating:4.9, horario:'08:00-17:00', dificultad:'Moderada', descripcion:'Cascada icónica con forma de velo.', distancia:'5 km de Chochís', transporte:'Caminata 20 min', experiencia:'Naturaleza, aventura', servicios:'Sin servicios', recomendacion:'Calzado antideslizante', precioLocal:15, precioExtranjero:40, imagen:'https://raw.githubusercontent.com/santacruzrojobore-sys/santarojobore/main/imagenes/lugarturistico/cascadavelodenovia.jpeg', googleMaps:'https://maps.app.goo.gl/QPo1Yjott9w5k2zV7' }
  ];

  const colorMunicipio = { 'Roboré': '#39FF14', 'Chochís': '#FFD700', 'Aguas Calientes': '#38BDF8' };

  let viewer;

  async function iniciarVisor() {
    const token = document.getElementById('tokenInput').value.trim();
    if (!token) { alert('Pega tu Cesium ion Access Token primero. Consíguelo gratis en https://ion.cesium.com/tokens'); return; }

    Cesium.Ion.defaultAccessToken = token;

    viewer = new Cesium.Viewer('cesiumContainer', {
      terrain: Cesium.Terrain.fromWorldTerrain(),
      timeline: false, animation: false, baseLayerPicker: false,
      geocoder: false, homeButton: false, sceneModePicker: false,
      navigationHelpButton: false, infoBox: false, selectionIndicator: false,
    });

    try {
      const bingLayer = await Cesium.IonImageryProvider.fromAssetId(2);
      viewer.imageryLayers.addImageryProvider(bingLayer);
    } catch (e) { console.warn('No se pudo cargar Bing Aerial.', e); }

    atractivos.forEach(function (lugar) {
      const color = colorMunicipio[lugar.municipio] || '#39FF14';
      viewer.entities.add({
        id: 'lugar-' + lugar.id,
        name: lugar.nombre,
        position: Cesium.Cartesian3.fromDegrees(lugar.lon, lugar.lat, 60),
        point: {
          pixelSize: 14,
          color: Cesium.Color.fromCssColorString(color),
          outlineColor: Cesium.Color.WHITE,
          outlineWidth: 2,
          heightReference: Cesium.HeightReference.CLAMP_TO_GROUND
        },
        label: {
          text: lugar.nombre,
          font: '11px DM Sans, sans-serif',
          fillColor: Cesium.Color.WHITE,
          outlineColor: Cesium.Color.BLACK,
          outlineWidth: 2,
          style: Cesium.LabelStyle.FILL_AND_OUTLINE,
          pixelOffset: new Cesium.Cartesian2(0, -22),
          heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
          distanceDisplayCondition: new Cesium.DistanceDisplayCondition(0, 40000)
        }
      });
    });

    viewer.screenSpaceEventHandler.setInputAction(function (movement) {
      const picked = viewer.scene.pick(movement.position);
      if (Cesium.defined(picked) && picked.id && String(picked.id.id || '').startsWith('lugar-')) {
        const id = parseInt(picked.id.id.replace('lugar-', ''));
        const lugar = atractivos.find(a => a.id === id);
        if (lugar) mostrarDetalle(lugar);
      }
    }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

    volverARobore();
    document.getElementById('tokenPanel').style.display = 'none';
    document.getElementById('infoPanel').style.display = 'block';
  }

  function mostrarDetalle(l) {
    document.getElementById('detailImg').src = l.imagen;
    document.getElementById('detailBody').innerHTML = `
      <h2>${l.nombre}</h2>
      <div class="tagRow">
        <span class="tag">★ ${l.rating}</span>
        <span class="tag">${l.municipio}</span>
        <span class="tag">${l.horario}</span>
        <span class="tag">${l.dificultad}</span>
      </div>
      <p class="descText">${l.descripcion}</p>
      <div class="infoGrid">
        <div class="item"><span class="lbl">Distancia</span>${l.distancia}</div>
        <div class="item"><span class="lbl">Cómo llegar</span>${l.transporte}</div>
        <div class="item"><span class="lbl">Experiencia</span>${l.experiencia}</div>
        <div class="item"><span class="lbl">Servicios</span>${l.servicios}</div>
      </div>
      <div class="tipBox">
        <div class="tlbl">Recomendación</div>
        <div class="ttxt">${l.recomendacion}</div>
      </div>
      <div class="priceBox">
        <div class="priceRow"><span>Visitante local</span><span class="big">Bs ${l.precioLocal}</span></div>
        <div class="priceRow"><span>Extranjero</span><strong>Bs ${l.precioExtranjero}</strong></div>
      </div>
      <div class="btnRow">
        <a class="btnMaps" href="${l.googleMaps}" target="_blank">📍 Ver en Google Maps</a>
      </div>
    `;
    document.getElementById('detailPanel').classList.add('open');
  }

  function cerrarDetalle() {
    document.getElementById('detailPanel').classList.remove('open');
  }

  window.volverARobore = function () {
    if (!viewer) return;
    viewer.camera.flyTo({
      destination: Cesium.Cartesian3.fromDegrees(ROBORE.lon, ROBORE.lat, 8000),
      orientation: { heading: Cesium.Math.toRadians(0), pitch: Cesium.Math.toRadians(-45), roll: 0 },
      duration: 2
    });
  };
</script>

</body>
</html>
